# Dependabot will run on day 27 of each month at 03:57 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      day: 12
      timezone: "Europe/Berlin"
      cronjob: "57 3 27 * *"
    open-pull-requests-limit: 15
    assignees:
      - "Garfonso"
    versioning-strategy: "increase"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      day: 12
      timezone: "Europe/Berlin"
      cronjob: "57 3 27 * *"
    open-pull-requests-limit: 15
    assignees:
      - "Garfonso"
